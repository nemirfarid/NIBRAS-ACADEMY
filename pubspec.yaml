name: nibras_academy
description: Application éducative pour les élèves algériens.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/videos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/nibras_launcher.png
  adaptive_icon_background: '#061D55'
  adaptive_icon_foreground: assets/branding/nibras_launcher.png
