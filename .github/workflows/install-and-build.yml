name: Install NIBRAS ZIP and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          test -f NIBRAS_ACADEMY_SOURCE.zip
          unzip -o NIBRAS_ACADEMY_SOURCE.zip -d .
          rm NIBRAS_ACADEMY_SOURCE.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: install NIBRAS ACADEMY starter" || echo "No changes"
          git push

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org dz.nibras.academy --project-name nibras_academy .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nibras-academy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
